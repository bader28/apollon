name: Build & publish wheels

# Builds pre-compiled wheels for Windows, macOS and Linux (CPython 3.9-3.13)
# and publishes them to PyPI on every version tag (e.g. `v0.1.5`).
#
# Publishing uses PyPI "Trusted Publishing" (OIDC) -- no API token/secret is
# stored in the repo. Configure the trusted publisher once on PyPI:
#   PyPI project (bader-apollon) -> Settings -> Publishing -> Add a new pending
#   publisher: owner=bader28, repo=apollon, workflow=wheels.yml, environment=pypi
#
# Trigger a release:  git tag v0.1.5 && git push github v0.1.5

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
