[project]
# Distribution name on PyPI. The original name "apollon" is owned by the
# upstream project (ifsm/apollon). This fork is published as "bader-apollon".
# The import name stays "apollon" (i.e. `import apollon`).
name = "bader-apollon"
version = "0.1.5"
description = "Feature extraction frame work for content-based music analysis"
authors = [ {name="Michael Blaß", email="mblass@posteo.net"} ]
license = { file="LICENSE.txt" }
readme = "README.md"
keywords = ["music", "analysis", "feature extraction"]
classifiers = [
	"License :: OSI Approved :: BSD License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.7",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Multimedia :: Sound/Audio :: Analysis",
	"Intended Audience :: Science/Research",
	"Intended Audience :: Information Technology",
	"License :: OSI Approved :: BSD License",
]
requires-python = ">=3.7"
dependencies = [
	"numpy >= 1.20",
	"jsonschema >= 3.2.0",
	"scipy >= 0.19.0",
	"matplotlib >= 2",
	"pandas >= 0.20",
	"soundfile >= 0.10.2",
	"bader-chainsaddiction >= 0.2.1",
]

[project.urls]
Repository = "https://codeberg.org/rbader/apollon"
Documentation = "https://codeberg.org/rbader/apollon"

[build-system]
requires = ["setuptools", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# cibuildwheel: builds pre-compiled wheels for Windows / macOS / Linux so that
# end users can `pip install` without a C compiler. Driven by GitHub Actions
# (see .github/workflows/wheels.yml). Building against NumPy 2.x yields wheels
# that run on NumPy >= 1.23 as well (NumPy 2 backward-compat ABI).
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *_ppc64le *_s390x"
build-frontend = "build"

[tool.cibuildwheel.macos]
archs = ["universal2"]
